spring:
  datasource:
    url: jdbc:h2:mem:fleetops;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_enum_jdbc_type: 12

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  h2:
    console:
      enabled: true
      path: /h2-console

  mail:
    host: localhost
    port: 1025

logging:
  level:
    com.fleetops: DEBUG
